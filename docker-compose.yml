services:
  postgres:
    image: postgres:15
    container_name: bikeshare-postgres
    environment:
      POSTGRES_DB: bikeshare
      POSTGRES_USER: bikeshare
      POSTGRES_PASSWORD: bikeshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  health-service:
    build: ./health-service
    container_name: health-service
    ports:
      - "8081:8081"
    restart: unless-stopped

  bike-availability-service:
    build: ./bike-availability-service
    container_name: bike-availability-service
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  pgdata:
